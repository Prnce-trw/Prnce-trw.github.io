function head(title,subtitle,actionText='',action=''){return `<div class="page-head"><div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div>${actionText?`<button class="primary" data-action="add" data-kind="${action}">${ic('plus',16)}<span class="button-text">${actionText}</span></button>`:''}</div>`}
function pill(label){let c=label==='เปิดรับสมัคร'||label==='ใช้งาน'?'open':label==='กำลังเรียน'?'run':label==='เตรียมเปิด'?'upcoming':'closed';return `<span class="pill ${c}">${escapeHTML(label)}</span>`}
function courseStatus(c){const today='2026-11-01';if(c.start<=today&&c.end>=today)return 'กำลังเรียน';if(c.regStart>today)return 'เตรียมเปิด';if(c.regStart<=today&&c.regEnd>=today)return 'เปิดรับสมัคร';return 'ปิดรับสมัคร'}
function dateTH(s){if(!s)return '—';const p=s.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:escapeHTML(s)}
function avatar(name,index=0,photo=''){let short=String(name||'').trim().slice(0,2);return `<div class="person" data-tone="${index%4}">${photo?`<img class="mini-avatar" src="${escapeHTML(photo)}" alt="รูปโปรไฟล์">`:`<span class="mini-avatar">${escapeHTML(short)}</span>`}`}

function filtered(arr,fields){const q=state.search.trim().toLowerCase();return arr.filter(x=>(!q||fields.some(f=>String(x[f]||'').toLowerCase().includes(q)))&&(state.filter==='all'||(x.status||x.type)===state.filter))}

function input(name,label,value='',type='text',required=false,full=false,placeholder=''){return `<div class="field ${full?'full':''}"><label for="f_${name}">${label}${required?' <em>*</em>':''}</label><input id="f_${name}" name="${name}" type="${type}" value="${escapeHTML(value)}" placeholder="${escapeHTML(placeholder)}" ${required?'required':''}></div>`}
function select(name,label,value,options,required=false){return `<div class="field"><label for="f_${name}">${label}${required?' <em>*</em>':''}</label><select name="${name}" id="f_${name}" ${required?'required':''}>${options.map(x=>`<option value="${escapeHTML(x)}" ${value===x?'selected':''}>${escapeHTML(x)}</option>`).join('')}</select></div>`}
function formBody(kind,obj){let o=obj||{};if(kind==='users')return `<div class="formgrid">${input('name','ชื่อ–นามสกุล',o.name,'text',true,true)}${input('email','อีเมล',o.email,'email',true)}${input('phone','เบอร์โทรศัพท์',o.phone,'tel')}${select('role','บทบาท',o.role,['ผู้ดูแลระบบ','ครูผู้สอน','เจ้าหน้าที่'],true)}${select('status','สถานะการใช้งาน',o.status,['ใช้งาน','ระงับ'],true)}</div>`;if(kind==='students')return `<div class="formgrid"><div class="sectiontag">ข้อมูลส่วนตัว</div><div class="field full"><label>รูปประจำตัว</label><div class="photo-row"><div class="photo-preview" id="photoPreview">${o.photo?`<img src="${escapeHTML(o.photo)}" alt="รูปนักเรียน">`:ic('student',24)}</div><div><input id="photoInput" type="file" accept="image/png,image/jpeg,image/webp"><small>รองรับ JPG, PNG, WEBP — แสดงตัวอย่างเฉพาะหน้านี้</small></div></div></div>${input('first','ชื่อ',o.first,'text',true)}${input('last','นามสกุล',o.last,'text',true)}${input('nickname','ชื่อเล่น',o.nickname)}${input('dob','วันเกิด',o.dob,'date')}<div class="sectiontag">ข้อมูลติดต่อ</div>${input('contact','ชื่อผู้ติดต่อ / ผู้ปกครอง',o.contact,'text',false,true)}${input('phone1','เบอร์โทร 1',o.phone1,'tel',true)}${input('phone2','เบอร์โทร 2',o.phone2,'tel')}${input('line','LINE ID',o.line,'text',false,true)}<div class="field full"><label for="f_note">หมายเหตุ</label><textarea id="f_note" name="note" placeholder="ข้อมูลเพิ่มเติมเกี่ยวกับนักเรียน...">${escapeHTML(o.note||'')}</textarea></div></div>`;return `<div class="formgrid">${input('name','ชื่อคอร์สเรียน',o.name,'text',true,true)}<div class="field full"><label for="f_description">รายละเอียดคอร์ส</label><textarea id="f_description" name="description" placeholder="คำอธิบายและเนื้อหาคอร์ส...">${escapeHTML(o.description||'')}</textarea></div><div class="sectiontag">ช่วงเวลารับสมัคร</div>${input('regStart','วันที่เริ่มสมัคร',o.regStart,'date',true)}${input('regEnd','วันที่สิ้นสุดสมัคร',o.regEnd,'date',true)}<div class="sectiontag">ช่วงเวลาที่เปิดสอน</div>${input('start','วันที่เริ่มต้นใช้งาน',o.start,'date',true)}${input('end','วันที่สิ้นสุดใช้งาน',o.end,'date',true)}<div class="sectiontag">รูปแบบการเรียน</div>${select('type','ประเภทของคอร์ส',o.type,['กลุ่ม','ตัวต่อตัว','ออนไลน์','เวิร์กช็อป'],true)}${input('capacity','จำนวนผู้เข้าเรียนต่อครั้ง',o.capacity||'','number',true)}${input('sessions','จำนวนครั้งในการสอน',o.sessions||'','number',true)}</div>`}
function openModal(kind,id=null){state.kind=kind;state.editing=id;const obj=id?demo[kind].find(x=>x.id===id):null;state.photo=obj?.photo||'';const title={users:'ผู้ใช้งาน',students:'นักเรียน',courses:'คอร์สเรียน'}[kind];$('#overlays').innerHTML=`<div class="modal-shade" data-action="modalShade"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modalhead"><div><h2 id="modalTitle">${obj?'แก้ไข':'เพิ่ม'}${title}</h2><p>กรอกข้อมูลด้านล่างเพื่อ${obj?'อัปเดต':'สร้าง'}รายการใน Prototype</p></div><button class="iconbtn" type="button" data-action="closeModal" aria-label="ปิด">${ic('close',18)}</button></header><form id="recordForm"><div class="modalbody">${formBody(kind,obj)}</div><footer class="modalfoot"><button class="secondary" type="button" data-action="closeModal">ยกเลิก</button><button class="primary" type="submit">${ic('check',16)} ${obj?'บันทึกการแก้ไข':'เพิ่มข้อมูล'}</button></footer></form></section></div>`;$('#recordForm').addEventListener('submit',saveRecord);$('#photoInput')?.addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;if(file.size>2*1024*1024){toast('โปรดเลือกรูปขนาดไม่เกิน 2 MB');e.target.value='';return}let reader=new FileReader();reader.onload=()=>{state.photo=reader.result;$('#photoPreview').innerHTML=`<img src="${reader.result}" alt="รูปนักเรียน">`};reader.readAsDataURL(file)});$('#f_name,#f_first')?.focus()}
function saveRecord(e){e.preventDefault();const kind=state.kind;let form=e.target;let data=Object.fromEntries(new FormData(form).entries());if(kind==='students'){data.photo=state.photo}if(kind==='courses'){data.capacity=Number(data.capacity);data.sessions=Number(data.sessions);if(data.capacity<1||data.sessions<1){toast('จำนวนผู้เรียนและจำนวนครั้งต้องมากกว่า 0');return}if(data.regStart>data.regEnd){toast('ช่วงวันรับสมัครไม่ถูกต้อง');return}if(data.start>data.end){toast('ช่วงวันเปิดสอนไม่ถูกต้อง');return}}if(state.editing){let idx=demo[kind].findIndex(x=>x.id===state.editing);demo[kind][idx]={...demo[kind][idx],...data}}else{demo[kind].unshift({id:Math.max(0,...demo[kind].map(x=>x.id))+1,...data})}$('#overlays').innerHTML='';state.search='';state.filter='all';render();toast(state.editing?'บันทึกการแก้ไขแล้ว (ข้อมูลจำลอง)':'เพิ่มข้อมูลสำเร็จ (ข้อมูลจำลอง)')}
let t;
function toast(s){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);clearTimeout(t);t=setTimeout(()=>d.remove(),2600)}
document.addEventListener('click',e=>{let page=e.target.closest('[data-page]');if(page){state.page=page.dataset.page;state.search='';state.filter='all';state.drawer=false;render();return}let act=e.target.closest('[data-action]');if(!act)return;let a=act.dataset.action;if(a==='add'||a==='edit'){openModal(act.dataset.kind,a==='edit'?Number(act.dataset.id):null)}if(a==='toggleMenu'){state.drawer=!state.drawer;render()}if(a==='closeMenu'){state.drawer=false;render()}if(a==='closeModal'){$('#overlays').innerHTML=''}if(a==='modalShade'&&e.target===act){$('#overlays').innerHTML=''}});
document.addEventListener('input',e=>{if(e.target.id!=='pageSearch')return;state.search=e.target.value;if(state.page==='students')studentRows();if(state.page==='users')userRows();if(state.page==='courses')courseCards()});document.addEventListener('change',e=>{if(e.target.id!=='filterSelect')return;state.filter=e.target.value;if(state.page==='users')userRows();if(state.page==='courses')courseCards()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlays').innerHTML){$('#overlays').innerHTML=''}});render();
})();
</script>
</body></html>
